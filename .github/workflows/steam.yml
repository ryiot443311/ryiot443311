name: Update Steam Stats

on:
  schedule:
    # 毎日UTCの0時（日本時間9時）に実行
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # リポジトリのコードチェックアウト
      - uses: actions/checkout@v4

      # Pythonの実行環境をセットアップ
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 環境変数とPythonスクリプト実行
      - name: Update README with Steam Stats
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python update_steam.py

      # 変更があった場合、自動でコミット＆プッシュ
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update Steam Stats" || exit 0
          git push
